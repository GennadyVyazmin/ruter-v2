name: Check source

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python tests and syntax
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests -v
          python3 -m compileall -q ruter_v2
          bash -n ruter-v2 ruter_v2/route.sh
